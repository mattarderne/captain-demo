<!DOCTYPE html>
<html lang="en">	
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>        
		<title>A trip under the moonlight</title>
		<style type="text/css">
			body {
				margin: 0px;
				overflow: hidden;
			}
			
			#env-selector {
				position: absolute;
				left: 5px;
				top: 10px;
				z-index: 1;
			}
			
			#env-selector, #env-selector ul {
				padding: 0px;
				margin: 0px;
			}
      
			#env-selector ul li {
				display: inline;
        padding: 0px;
        margin:0px;      
      }
			
			#env-selector ul li a {
				display: inline;
        text-decoration: none;
				background-color: #000;
				color: #fff;
				opacity: 0.6;
				padding: 5px;
				font-family: Arial;
				font-size: medium;
				cursor: pointer;
				margin-right: 5px;
				transition: all 1s;
			}
			
			#env-selector ul li a:hover {
				background-color: #fff;
				color: #000;
			}
			
			#env-selector ul li.selected a {
				background-color: #3333cc;
				color: #fff;
			}
		</style>     
    <link href="js/libs/messg.css" rel="stylesheet">
	</head>
	<body>
			
		<!-- PATCH (voice-boat lighting-overhaul round): six presets -> three curated, verified-
		     readable states (dawn/day/dusk) — see port/fft-ocean/js/demo.js's
		     FFT_OCEAN_LIGHTING_PRESETS and port/captain-ocean/checkpoints/lighting-overhaul.md. -->
		<div id="env-selector">
			<ul>
				<li key="dawn">Dawn</li>
				<li key="day">Day</li>
				<li key="dusk">Dusk</li>
			</ul>
		</div>

		<script src="js/libs/three.min.js"></script>
		<script src="js/libs/dat.gui.min.js"></script>
		<!-- PATCH (voice-boat lighting-overhaul round): removed a stray
		     <script src="js/libs/jquery-2.1.4.min.js"> tag found here — that file does not exist in
		     this repo (js/libs/ only ships three.min.js/dat.gui.min.js/messg.min.js) and never has;
		     the stage-1 spike's whole point was rewriting demo.js's jQuery call-sites to vanilla DOM
		     specifically because that 404 was aborting DEMO.Initialize() before InitCommands()/
		     Resize() ran (see demo.js's InitGui/InitCommands PATCH notes and the "stage 2" comment
		     below, which already documented the tag as removed). No vanilla-DOM code in this file
		     depends on jQuery — confirmed via a clean network tab on a real page load. -->
		<script src="js/libs/messg.min.js"></script>
		<script src="js/controls/OrbitControls.js"></script>
		<script src="js/shaders/ScreenSpaceShader.js"></script>
		<script src="js/shaders/FFTOceanShader.js"></script>
		<script src="js/shaders/OceanShader.js"></script>
		<script src="js/effects/MirrorRenderer.js"></script>
		<script src="js/shaders/CloudShader2.js"></script>
		<script src="js/shaders/RainShader.js"></script>
		<script src="js/loaders/OBJMTLLoader.js"></script>
		<script src="js/loaders/MTLLoader.js"></script>
		<script src="js/effects/Ocean.js"></script>		
		<script src="js/demo.js"></script>

		<script>
			var lastTime = ( new Date() ).getTime();

			var WINDOW = {
				ms_Width : 0,
				ms_Height : 0,
				ms_Callbacks : {
					70: "WINDOW.ToggleFullScreen()", // Toggle fullscreen
				},

				Initialize : function () {
					this.UpdateSize();

					// Create callbacks from keyboard
					document.onkeydown = function ( inEvent ) { WINDOW.CallAction( inEvent.keyCode ); };
					window.onresize = function ( inEvent ) {
						WINDOW.UpdateSize();
						WINDOW.ResizeCallback( WINDOW.ms_Width, WINDOW.ms_Height );
					};
				},
				
				UpdateSize : function () {
					this.ms_Width = window.innerWidth ;
					this.ms_Height = window.innerHeight;
				},
				
				CallAction : function ( inId ) {
					if ( inId in this.ms_Callbacks ) {
						eval( this.ms_Callbacks[inId] );
						return false;
					}
				},
				
				ToggleFullScreen : function () {
					if ( !document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement ) {
						if ( document.documentElement.requestFullscreen ) {
							document.documentElement.requestFullscreen();
						}
						else if ( document.documentElement.mozRequestFullScreen ) {
							document.documentElement.mozRequestFullScreen();
						}
						else if (document.documentElement.webkitRequestFullscreen) {
							document.documentElement.webkitRequestFullscreen( Element.ALLOW_KEYBOARD_INPUT );
						}
					}
					else {
						if ( document.cancelFullScreen ) {
							document.cancelFullScreen();
						}
						else if ( document.mozCancelFullScreen ) {
							document.mozCancelFullScreen();
						}
						else if ( document.webkitCancelFullScreen ) {
							document.webkitCancelFullScreen();
						}
					}
				},
				ResizeCallback : function ( inWidth, inHeight ) { },
			};

			WINDOW.Initialize();
			
			DEMO.Initialize();

			WINDOW.ResizeCallback = function ( inWidth, inHeight ) { DEMO.Resize( inWidth, inHeight ); };
			DEMO.Resize( WINDOW.ms_Width, WINDOW.ms_Height );

			var render = function () {

				requestAnimationFrame( render );
				DEMO.Update();

			};

			render();

		</script>

		<!-- PATCH (voice-boat stage 2): the only other index.html edit besides the jQuery vendoring
		     note from the stage 1 spike. Loaded last, after DEMO.Initialize()/render() above have
		     already run once, so window.DEMO.ms_GroupShip/ms_BlackPearlShip exist by the time this
		     executes (see captain-ocean/src/app.ts's comment on script ordering for why one harmless
		     zero-motion frame runs first). This is a plain classic script (IIFE build output, no
		     type="module"), built from port/captain-ocean via `npm run build` there — see
		     port/captain-ocean/README.md. It contains our bus/sim/adapters/voice/hud code (bundled,
		     zero three.js) and starts its own independent requestAnimationFrame loop; see
		     port/captain-ocean/STAGE2-REPORT.md for the full wiring. -->
		<script src="../captain-ocean/dist/captain-ocean.js"></script>
		<!-- PATCH (voice-boat public deploy): BYOK disclaimer + attribution footer. -->
		<div style="position:fixed;bottom:4px;right:8px;z-index:40;font:10px/1.5 monospace;color:rgba(255,255,255,0.55);text-align:right;pointer-events:none;">
			Your OpenAI key stays in this browser (localStorage) and is sent only to api.openai.com — no server, no telemetry.<br>
			Ocean: <a style="color:rgba(255,255,255,0.7);pointer-events:auto;" href="https://github.com/jbouny/fft-ocean">fft-ocean</a> (MIT) · Sail data: <a style="color:rgba(255,255,255,0.7);pointer-events:auto;" href="https://github.com/leeboardtools/bythelee">By The Lee</a> (Apache-2.0)
		</div>
	</body>
</html>
